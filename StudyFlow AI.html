const SAMPLE="Fotosinteza është procesi me të cilin bimët, algat dhe disa baktere e shndërrojnë energjinë e dritës në energji kimike të ruajtur në glukozë. Ajo zhvillohet kryesisht në kloroplastet e qelizave të gjetheve, të cilat përmbajnë pigmentin e gjelbër klorofil.\n\nReaksionet e varura nga drita zhvillohen në membranat e tilakoideve. Klorofili thith dritën e diellit, ndan molekulat e ujit dhe çliron oksigjenin si produkt anësor. Në këtë fazë prodhohen ATP dhe NADPH, që e bartin energjinë drejt fazës tjetër.\n\nCikli i Calvinit zhvillohet në stromën e kloroplastit. Ai përdor ATP dhe NADPH për ta lidhur dioksidin e karbonit në molekula sheqeri. Kjo fazë nuk ka nevojë drejtpërdrejt për dritë, por varet nga produktet e reaksioneve të dritës.\n\nFaktorë si intensiteti i dritës, temperatura dhe përqendrimi i dioksidit të karbonit e kufizojnë shpejtësinë e fotosintezës. Kur njëri prej tyre mungon, ai bëhet faktori kufizues dhe i gjithë procesi ngadalësohet.";
